name: Build and Release LLVM

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/build-llvm/**'
  pull_request:
    branches: [master]
  repository_dispatch:
    types: [update-llvm-version]
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version to build'
        required: true
        default: '23.1.0'

# One build per LLVM version at a time: the release checker fires every six hours until the newest
# version exists, and a second run for the same version must queue behind the first, not race it.
concurrency:
  group: build-llvm-${{ github.event.client_payload.version || github.event.inputs.llvm_version || '23.1.0' }}
  cancel-in-progress: false

env:
  llvm_version: ${{ github.event.client_payload.version || github.event.inputs.llvm_version || '23.1.0' }}
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"  # the server must outlive long link phases with no compiles

jobs:
  # LLVM + clang + lld + MLIR does not reliably fit one 6-hour free runner job, so the build is
  # time-boxed. Every finished object lands in sccache (backed by the Actions cache), and a
  # second attempt resumes from that warm cache when the first one runs out of time.
  build:
    name: Build LLVM ${{ github.event.client_payload.version || github.event.inputs.llvm_version || '23.1.0' }}
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      completed: ${{ steps.llvm.outputs.completed }}
    steps:
      - uses: actions/checkout@v4

      - id: llvm
        uses: ./.github/actions/build-llvm
        with:
          llvm_version: ${{ env.llvm_version }}

      - name: Upload artifact
        if: steps.llvm.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LLVM-${{ env.llvm_version }}-win64
          path: LLVM-${{ env.llvm_version }}-win64.7z
          compression-level: 0

  build-resume:
    name: Resume build LLVM ${{ github.event.client_payload.version || github.event.inputs.llvm_version || '23.1.0' }}
    needs: build
    if: needs.build.outputs.completed != 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      completed: ${{ steps.llvm.outputs.completed }}
    steps:
      - uses: actions/checkout@v4

      - id: llvm
        uses: ./.github/actions/build-llvm
        with:
          llvm_version: ${{ env.llvm_version }}

      - name: Upload artifact
        if: steps.llvm.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LLVM-${{ env.llvm_version }}-win64
          path: LLVM-${{ env.llvm_version }}-win64.7z
          compression-level: 0

  release:
    name: Release LLVM ${{ github.event.client_payload.version || github.event.inputs.llvm_version || '23.1.0' }}
    needs: [build, build-resume]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.build.outputs.completed == 'true' || needs.build-resume.outputs.completed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LLVM-${{ env.llvm_version }}-win64

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.llvm_version }}
          name: LLVM-${{ env.llvm_version }}-win64
          body: |
            LLVM ${{ env.llvm_version }} with clang, lld and **MLIR**, built for development on Windows with the
            Rust libraries [inkwell](https://crates.io/crates/inkwell) (`LLVM_SYS_<ver>_PREFIX`) and
            [melior](https://crates.io/crates/melior) / [mlir-sys](https://crates.io/crates/mlir-sys)
            (`MLIR_SYS_<ver>_PREFIX`, `TABLEGEN_<ver>_PREFIX`).
            Targets: X86, AArch64, WebAssembly, SPIR-V. Includes `LLVM-C.dll`, `MLIR-C.dll`, `libclang.dll` and the
            compiler-rt builtins. inkwell users: the package has four backends, so depend on inkwell with
            `default-features = false` and explicit `target-*` features.
            Requires [Visual Studio 2022](https://visualstudio.microsoft.com/vs/community/) with the "Desktop development with C++" workload.
            Requires [7-zip](https://www.7-zip.org/download.html) to unpack.
          files: LLVM-${{ env.llvm_version }}-win64.7z
          draft: false
          prerelease: false
          # A manually dispatched build is usually an older version (22.1.x while 23 is current);
          # marking it latest would make the release checker re-dispatch the newest LLVM forever.
          make_latest: ${{ github.event_name != 'workflow_dispatch' }}
